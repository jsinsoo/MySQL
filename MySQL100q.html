<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MySQL 100단계 코드이해 자동평가</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#dfe5ee;--primary:#2563eb;--good:#087a55;--bad:#b42318;--code:#101828;--codeText:#eef2f6}
body.dark{--bg:#101828;--card:#182230;--text:#f2f4f7;--muted:#98a2b3;--line:#344054;--primary:#84adff;--code:#0b1220}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.68}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.top{max-width:1250px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:900;margin-right:auto}.btn,input,select{font:inherit}.btn,input,select{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:8px 10px}
.btn{cursor:pointer}.btn.primary{background:var(--primary);color:white;border-color:var(--primary)}
.progress{height:5px;background:var(--line)}#bar{height:100%;background:var(--primary);width:0}
.hero{max-width:1250px;margin:22px auto;padding:22px}.hero h1{font-size:clamp(28px,4vw,46px);margin:0 0 10px}.hero p{color:var(--muted)}
.student-box{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:14px;border-radius:14px;margin-top:15px}
.student-box input{min-width:180px}
main{max-width:1250px;margin:auto;padding:0 18px 60px}.section{margin:28px 0 12px;padding:13px 16px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#0f766e);color:#fff}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.q h3{margin:0 0 8px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.badge{background:#eff4ff;color:#175cd3;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800}
body.dark .badge{background:#1d2939;color:#84adff}
.concept{padding:12px 14px;background:color-mix(in srgb,var(--primary) 8%,var(--card));border-left:4px solid var(--primary);border-radius:10px;margin:10px 0}
pre{background:var(--code);color:var(--codeText);padding:16px;border-radius:12px;overflow:auto;white-space:pre-wrap}
.copy{float:right;margin-top:8px}.stem{font-weight:800;margin:14px 0 8px}
.option{display:block;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:8px 0;cursor:pointer}
.option:hover{border-color:var(--primary)} .option input{margin-right:8px}
.note{color:var(--muted);font-size:13px}.result{display:none;margin-top:12px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--primary) 5%,var(--card))}
.result.show{display:block}.ok{color:var(--good);font-weight:800}.no{color:var(--bad);font-weight:800}
.exp-list{margin:8px 0 0;padding-left:22px}.exp-list li{margin:6px 0}
.submitbox{position:sticky;bottom:12px;z-index:8;max-width:1250px;margin:18px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 8px 30px rgba(0,0,0,.12);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{font-size:18px;font-weight:900;margin-right:auto}.hidden{display:none!important}
.summary{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:24px 0}.summary h2{margin-top:0}
@media(max-width:700px){.top{align-items:stretch}.brand{width:100%}.student-box input{width:100%}.q{padding:15px}}
@media print{header,.submitbox,.copy{display:none!important}body{background:white;color:black}.q{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header>
<div class="top">
  <div class="brand">MySQL 100단계 코드이해 자동평가</div>
  <input id="search" placeholder="단계·명령어 검색">
  <select id="jump"><option value="">문항 이동</option></select>
  <button class="btn" id="darkBtn">다크 모드</button>
  <button class="btn" onclick="window.print()">인쇄/PDF</button>
</div>
<div class="progress"><div id="bar"></div></div>
</header>

<section class="hero">
<h1>MySQL 기초 → 응용 → 심화<br>100단계 코드 이해 평가</h1>
<p>각 단계의 코드를 먼저 읽고, 코드의 실제 동작과 핵심 개념을 바탕으로 <b>옳은 것 3개</b>를 선택하세요. 100문항 × 1점 = 100점이며, 제출 후 문항별 정오답과 보기별 상세 풀이를 확인하고 TXT 결과 파일로 저장할 수 있습니다.</p>
<div class="student-box">
  <input id="sid" placeholder="학번 입력" autocomplete="off">
  <input id="sname" placeholder="이름 입력" autocomplete="off">
  <button class="btn primary" onclick="gradeQuiz()">채점하기</button>
  <button class="btn" onclick="saveTxt()">TXT 결과 저장</button>
</div>
</section>

<main id="quiz"></main>
<div class="submitbox">
  <div class="score" id="scoreBox">미채점 · 100문항</div>
  <button class="btn primary" onclick="gradeQuiz()">전체 채점</button>
  <button class="btn" onclick="showWrongOnly()">오답만 보기</button>
  <button class="btn" onclick="showAll()">전체 보기</button>
  <button class="btn" onclick="saveTxt()">TXT 저장</button>
</div>

let graded=false, lastScore=0, lastDetails=[];

function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function sectionTitle(n){
  const ranges=[
    [1,10,'01~10 시작과 DB 기초'],[11,20,'11~20 테이블과 CRUD'],[21,30,'21~30 조건·정렬·검색'],
    [31,40,'31~40 집계·GROUP BY'],[41,50,'41~50 설계·제약조건'],[51,60,'51~60 JOIN'],
    [61,70,'61~70 서브쿼리·집합·VIEW'],[71,80,'71~80 트랜잭션·동시성'],[81,90,'81~90 인덱스·권한·백업'],
    [91,100,'91~100 함수·CTE·윈도·프로시저·트리거']
  ];
  return ranges.find(r=>n>=r[0]&&n<=r[1])[2];
}
function render(){
  const root=document.getElementById('quiz');
  let out='', last='';
  items.forEach(it=>{
    const sec=sectionTitle(it.n);
    if(sec!==last){out+=`<h2 class="section" id="sec${it.n}">${sec}</h2>`;last=sec;}
    out+=`<article class="q" id="q${it.n}" data-n="${it.n}">
      <div class="meta"><span class="badge">${String(it.n).padStart(3,'0')}단계</span><span class="badge">${esc(it.title)}</span></div>
      <h3>${it.n}. ${esc(it.title)} 코드 이해</h3>
      <div class="concept"><b>코드 핵심 설명</b><br>${esc(it.explain)}</div>
      <button class="btn copy" onclick="copyCode(${it.n})">코드 복사</button>
      <pre><code>${esc(it.code)}</code></pre>
      <div class="stem">위 코드에 관한 설명으로 옳은 것을 모두 고르시오. <span class="note">(정확히 3개 선택)</span></div>
      <div class="opts">
      ${it.options.map((o,i)=>`<label class="option"><input type="checkbox" name="q${it.n}" value="${i}"> ${i+1}. ${esc(o)}</label>`).join('')}
      </div>
      <div class="result" id="r${it.n}"></div>
    </article>`;
  });
  root.innerHTML=out;
  const jump=document.getElementById('jump');
  items.forEach(it=>{const o=document.createElement('option');o.value=it.n;o.textContent=`${it.n}번 ${it.title}`;jump.appendChild(o);});
}
render();

function copyCode(n){
  const it=items.find(x=>x.n===n);
  navigator.clipboard.writeText(it.code);
}
function selected(n){
  return [...document.querySelectorAll(`input[name="q${n}"]:checked`)].map(x=>Number(x.value)).sort((a,b)=>a-b);
}
function same(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}

function gradeQuiz(){
  const sid=document.getElementById('sid').value.trim();
  const nm=document.getElementById('sname').value.trim();
  if(!sid||!nm){alert('학번과 이름을 입력하세요.');return;}
  let score=0; lastDetails=[];
  items.forEach(it=>{
    const ans=selected(it.n);
    const ok=same(ans,[...it.correct].sort((a,b)=>a-b));
    if(ok) score++;
    const chosen=ans.map(i=>i+1).join(', ')||'미선택';
    const correct=it.correct.map(i=>i+1).join(', ');
    lastDetails.push({n:it.n,title:it.title,ok,chosen,correct});
    const r=document.getElementById('r'+it.n);
    r.classList.add('show');
    r.innerHTML=`<div class="${ok?'ok':'no'}">${ok?'정답':'오답'} · 선택: ${chosen} · 정답: ${correct}</div>
      <div><b>핵심 풀이:</b> ${esc(it.explain)}</div>
      <ol class="exp-list">${it.option_expl.map((e,i)=>`<li><b>${i+1}번:</b> ${esc(e)}</li>`).join('')}</ol>`;
    document.getElementById('q'+it.n).dataset.wrong=ok?'0':'1';
  });
  graded=true;lastScore=score;
  document.getElementById('scoreBox').textContent=`${sid} ${nm} · ${score} / 100점`;
  document.getElementById('bar').style.width=score+'%';
  window.scrollTo({top:0,behavior:'smooth'});
}

function ts(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;
}
function saveTxt(){
  if(!graded){gradeQuiz(); if(!graded)return;}
  const sid=document.getElementById('sid').value.trim();
  const nm=document.getElementById('sname').value.trim();
  const stamp=ts();
  let txt=`MySQL 100단계 코드이해 자동평가\n`;
  txt+=`학번: ${sid}\n이름: ${nm}\n점수: ${lastScore}/100\n응시시각: ${stamp.replace('_',' ')}\n`;
  txt+='='.repeat(70)+'\n\n';
  lastDetails.forEach(d=>{
    const it=items.find(x=>x.n===d.n);
    txt+=`${d.n}번 [${d.ok?'정답':'오답'}] ${d.title}\n`;
    txt+=`선택: ${d.chosen} / 정답: ${d.correct}\n`;
    txt+=`코드:\n${it.code}\n`;
    txt+=`핵심 풀이: ${it.explain}\n`;
    it.option_expl.forEach((e,i)=>txt+=`  ${i+1}번: ${e}\n`);
    txt+='\n';
  });
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const safe=s=>s.replace(/[\\/:*?"<>|\s]+/g,'_');
  a.download=`${safe(sid)}_${safe(nm)}_${lastScore}_MySQL_${stamp}.txt`;
  a.click(); URL.revokeObjectURL(a.href);
}

function showWrongOnly(){
  if(!graded){alert('먼저 채점하세요.');return;}
  document.querySelectorAll('.q').forEach(q=>q.classList.toggle('hidden',q.dataset.wrong!=='1'));
  document.querySelectorAll('.section').forEach(s=>s.classList.add('hidden'));
}
function showAll(){
  document.querySelectorAll('.q,.section').forEach(x=>x.classList.remove('hidden'));
}
document.getElementById('jump').addEventListener('change',e=>{
  if(e.target.value) document.getElementById('q'+e.target.value).scrollIntoView({behavior:'smooth',block:'start'});
});
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.q').forEach(card=>card.classList.toggle('hidden',q&&!card.innerText.toLowerCase().includes(q)));
});
document.getElementById('darkBtn').onclick=()=>document.body.classList.toggle('dark');
</script>
</body>
